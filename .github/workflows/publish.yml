name: Publish Docker

# Builds the production image and pushes it to GitHub Container Registry as
# ghcr.io/hillmarkets/documenso. Runs on version tags (v1.2.3, v1.2.3-rc.1) or
# by hand for any ref.
#
# Differences from upstream: no Docker Hub, no WarpBuild runners, no telemetry
# build args, and auth uses the workflow's own GITHUB_TOKEN so no secrets are
# required. arm64 is built under QEMU and is slow, so it is opt-in until the
# repo is public and can use GitHub's free native arm64 runners.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag, branch or SHA)'
        required: false
        default: main
        type: string
      arm64:
        description: 'Also build linux/arm64 (emulated, slow)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-tags: true

      - name: Resolve version and platforms
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${{ github.ref_name }}"
          else
            version="$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          fi

          sha="$(git rev-parse HEAD)"
          tags="${IMAGE}:${version},${IMAGE}:${sha}"

          # Stable releases move `latest`; release candidates move `rc`.
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="${tags},${IMAGE}:latest"
          elif [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            tags="${tags},${IMAGE}:rc"
          fi

          platforms="linux/amd64"
          if [[ "${{ inputs.arm64 }}" == "true" ]]; then
            platforms="linux/amd64,linux/arm64"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.arm64 == true }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
